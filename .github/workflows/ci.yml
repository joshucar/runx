name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build runx.slnx --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/MysterNybble.Runx --configuration Release --no-build --output artifacts/packages -p:ContinuousIntegrationBuild=true

      - name: Install and smoke test the package
        run: ./eng/smoke-test.ps1

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14
