name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      ContinuousIntegrationBuild: 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Keep the running tool separate from the outputs its build task replaces on Windows.
      - name: Bootstrap runx from this checkout
        run: dotnet build src/MysterNybble.Runx --configuration Release --output artifacts/bootstrap

      - name: Validate repo tasks with runx
        run: dotnet artifacts/bootstrap/MysterNybble.Runx.dll --check

      - name: Build, test, pack, and smoke test with runx
        run: dotnet artifacts/bootstrap/MysterNybble.Runx.dll ci

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14
